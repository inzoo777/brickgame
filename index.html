<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Brick Game - 20 Levels</title>
    <style>
        :root {
            --bg-color: #2b3a32;
            --console-color: #4a5d52;
            --screen-bg: #9ead86;
            --screen-border: #2c382f;
            --pixel-dark: #1f2821;
            --pixel-light: #9ead86;
            --btn-color: #d1c7bd;
            --btn-shadow: #8c8279;
            --accent-red: #a83232;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        .console {
            background-color: var(--console-color);
            border: 6px solid #1a241f;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }

        .brand {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #d1c7bd;
            margin-bottom: 8px;
            text-shadow: 1px 1px #111;
        }

        .screen-container {
            background-color: var(--screen-border);
            padding: 10px;
            border-radius: 8px;
            border: 3px solid #1a241f;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        canvas {
            background-color: var(--screen-bg);
            display: block;
            border: 2px solid var(--pixel-dark);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 80px;
            font-size: 11px;
            color: var(--pixel-dark);
            font-weight: bold;
        }

        .stat-box {
            background-color: var(--screen-bg);
            border: 2px solid var(--pixel-dark);
            padding: 4px;
            text-align: center;
            border-radius: 3px;
        }

        .stat-box span {
            display: block;
            font-size: 14px;
            color: var(--accent-red);
            margin-top: 2px;
        }

        /* Controls Layout */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 100%;
            gap: 15px;
            margin-top: 5px;
        }

        .d-pad {
            position: relative;
            width: 130px;
            height: 130px;
        }

        .btn {
            background: linear-gradient(145deg, #e2d8cd, #b8aea3);
            border: 2px solid #554e48;
            border-radius: 50%;
            color: #2c2824;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.05s ease;
        }

        .btn:active, .btn.pressed {
            background: linear-gradient(145deg, #a89e93, #d2c8bd);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }

        .d-btn {
            position: absolute;
            width: 42px;
            height: 42px;
            border-radius: 6px;
        }

        .btn-up { top: 0; left: 44px; }
        .btn-left { top: 44px; left: 0; }
        .btn-right { top: 44px; right: 0; }
        .btn-down { bottom: 0; left: 44px; }

        .action-pad {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            position: relative;
        }

        .btn-rotate {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--accent-red), #802222);
            color: white;
            border: 2px solid #521313;
            font-size: 13px;
            box-shadow: 0 5px 8px rgba(0,0,0,0.4);
        }
        .btn-rotate:active {
            background: linear-gradient(145deg, #802222, var(--accent-red));
        }

        .sub-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 15px;
            padding: 0 10px;
        }

        .small-btn {
            background: #b8aea3;
            border: 1px solid #554e48;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 10px;
            color: #2c2824;
            font-weight: bold;
            cursor: pointer;
        }

        /* Overlay screens */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .overlay h1 {
            color: #f39c12;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .overlay p {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .menu-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(231,76,60,0.4);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="console">
        <div class="brand">BRICK GAME • 20 LEVELS</div>

        <div class="screen-container">
            <canvas id="tetris" width="120" height="200"></canvas>
            <div class="side-panel">
                <div class="stat-box">
                    SCORE
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    HI-SCORE
                    <span id="highscore">0</span>
                </div>
                <div class="stat-box">
                    LEVEL
                    <span id="level">1</span>
                </div>
                <div class="stat-box">
                    LINES
                    <span id="lines">0</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="d-pad">
                <div class="btn d-btn btn-up" id="btn-up">▲</div>
                <div class="btn d-btn btn-left" id="btn-left">◄</div>
                <div class="btn d-btn btn-right" id="btn-right">►</div>
                <div class="btn d-btn btn-down" id="btn-down">▼</div>
            </div>
            <div class="action-pad">
                <div class="btn btn-rotate" id="btn-rotate">ROTA</div>
            </div>
        </div>

        <div class="sub-controls">
            <button class="small-btn" id="btn-sound">SOUND: ON</button>
            <button class="small-btn" id="btn-pause">PAUSE</button>
            <button class="small-btn" id="btn-reset">RESET</button>
        </div>
    </div>

    <!-- Start / Game Over Overlay -->
    <div id="overlay" class="overlay">
        <h1>CLASSIC BRICK GAME</h1>
        <p>Complete lines to advance through all 20 levels! Speed increases with each level.</p>
        <button class="menu-btn" id="start-btn">PLAY GAME</button>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const BLOCK_SIZE = 10;

        context.scale(BLOCK_SIZE, BLOCK_SIZE);

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            score: 0,
            lines: 0,
            level: 1
        };

        let highScore = localStorage.getItem('brick_hi') || 0;
        document.getElementById('highscore').innerText = highScore;

        let dropCounter = 0;
        let dropInterval = 1000; // Will adjust based on 20 levels
        let lastTime = 0;
        let isPaused = false;
        let soundEnabled = true;

        // Audio synthesizer for retro sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            if (!soundEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function createPiece(type) {
            if (type === 'T') {
                return [
                    [0, 1, 0],
                    [1, 1, 1],
                    [0, 0, 0],
                ];
            } else if (type === 'O') {
                return [
                    [2, 2],
                    [2, 2],
                ];
            } else if (type === 'L') {
                return [
                    [0, 0, 3],
                    [3, 3, 3],
                    [0, 0, 0],
                ];
            } else if (type === 'J') {
                return [
                    [4, 0, 0],
                    [4, 4, 4],
                    [0, 0, 0],
                ];
            } else if (type === 'I') {
                return [
                    [0, 0, 0, 0],
                    [5, 5, 5, 5],
                    [0, 0, 0, 0],
                    [0, 0, 0, 0],
                ];
            } else if (type === 'S') {
                return [
                    [0, 6, 6],
                    [6, 6, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        function drawMatrix(matrix, offset) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        context.fillStyle = '#1f2821';
                        context.fillRect(x + offset.x, y + offset.y, 1, 1);
                        // Inner pixel retro effect
                        context.fillStyle = '#9ead86';
                        context.fillRect(x + offset.x + 0.1, y + offset.y + 0.1, 0.8, 0.8);
                        context.fillStyle = '#1f2821';
                        context.fillRect(x + offset.x + 0.2, y + offset.y + 0.2, 0.6, 0.6);
                    }
                });
            });
        }

        function draw() {
            context.fillStyle = '#9ead86';
            context.fillRect(0, 0, canvas.width, canvas.height);

            drawMatrix(arena, {x: 0, y: 0});
            drawMatrix(player.matrix, player.pos);
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate(dir) {
            const posX = player.pos.x;
            let offset = 1;
            rotate(player.matrix, dir);
            playTone(400, 'triangle', 0.05);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -dir);
                    player.pos.x = posX;
                    return;
                }
            }
        }

        function collide(arena, player) {
            const m = player.matrix;
            const o = player.pos;
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function arenaSweep() {
            let rowCount = 1;
            let cleared = 0;
            outer: for (let y = arena.length - 1; y > 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }
                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;
                cleared++;
            }

            if (cleared > 0) {
                playTone(600, 'square', 0.15);
                player.lines += cleared;
                player.score += cleared * 10 * player.level;
                
                // 20 Levels calculation (Every 5 lines increases level, max 20)
                player.level = Math.min(20, Math.floor(player.lines / 5) + 1);
                
                // Speed adjustment across 20 levels
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 45);
                
                updateScore();
            }
        }

        function playerDrop() {
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                playTone(150, 'sawtooth', 0.08);
            }
            dropCounter = 0;
        }

        function playerMove(dir) {
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            } else {
                playTone(300, 'sine', 0.03);
            }
        }

        function playerHardDrop() {
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            playTone(120, 'sawtooth', 0.1);
            dropCounter = 0;
        }

        function playerReset() {
            const pieces = 'TJLOSZI';
            player.matrix = createPiece(pieces[(pieces.length * Math.random()) | 0]);
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
            
            if (collide(arena, player)) {
                playTone(80, 'sawtooth', 0.4);
                // Game Over
                if (player.score > highScore) {
                    highScore = player.score;
                    localStorage.setItem('brick_hi', highScore);
                    document.getElementById('highscore').innerText = highScore;
                }
                document.getElementById('overlay').classList.remove('hidden');
                document.querySelector('#overlay h1').innerText = "GAME OVER";
                document.querySelector('#overlay p').innerText = `Final Score: ${player.score}\nLevel Reached: ${player.level}/20`;
                document.getElementById('start-btn').innerText = "PLAY AGAIN";
                isPaused = true;
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function update(time = 0) {
            if (isPaused) return;
            const deltaTime = time - lastTime;
            lastTime = time;
            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }
            draw();
            requestAnimationFrame(update);
        }

        function resetGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            dropInterval = 1000;
            updateScore();
            playerReset();
        }

        // Button Event Handlers for Touch & Click
        function bindButton(id, action) {
            const el = document.getElementById(id);
            if (!el) return;

            const trigger = (e) => {
                e.preventDefault();
                if (isPaused) return;
                action();
            };

            el.addEventListener('touchstart', trigger, {passive: false});
            el.addEventListener('mousedown', trigger);
        }

        bindButton('btn-left', () => playerMove(-1));
        bindButton('btn-right', () => playerMove(1));
        bindButton('btn-down', playerDrop);
        bindButton('btn-up', playerHardDrop);
        bindButton('btn-rotate', () => playerRotate(1));

        // Keyboard support for testing
        window.addEventListener('keydown', event => {
            if (isPaused) return;
            if (event.key === 'ArrowLeft') playerMove(-1);
            else if (event.key === 'ArrowRight') playerMove(1);
            else if (event.key === 'ArrowDown') playerDrop();
            else if (event.key === 'ArrowUp') playerHardDrop();
            else if (event.key === 'x' || event.key === 'X') playerRotate(1);
        });

        // Menu & Utility Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('overlay').classList.add('hidden');
            resetGame();
            isPaused = false;
            lastTime = performance.now();
            update();
        });

        document.getElementById('btn-pause').addEventListener('click', () => {
            if (document.getElementById('overlay').classList.contains('hidden')) {
                isPaused = !isPaused;
                document.getElementById('btn-pause').innerText = isPaused ? "RESUME" : "PAUSE";
                if (!isPaused) {
                    lastTime = performance.now();
                    update();
                }
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            resetGame();
            isPaused = false;
            document.getElementById('overlay').classList.add('hidden');
            lastTime = performance.now();
            update();
        });

        document.getElementById('btn-sound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('btn-sound').innerText = soundEnabled ? "SOUND: ON" : "SOUND: OFF";
        });
    </script>
</body>
</html>
